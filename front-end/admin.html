<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - BioGenetics</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="img/logo.png" alt="BioGenetics Logo">
            <span class="brand-name">BioGenetics</span>
        </div>
        <nav>
            <div class="user-menu">
                <img src="img/icon.png" alt="User Icon" class="user-icon">
                <div class="dropdown-menu">
                    <a href="../back-end/logout.php" class="logout-btn">Cerrar Sesión</a>
                </div>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1 class="admin-title">Funcionalidades Administrador</h1>
        <div class="admin-options">
            <div class="admin-option" onclick="location.href='agregarObra.html'">
                <h2>Agregar Obra Social</h2>
                <p>Incluir una nueva obra social en el sistema</p>
            </div>
            <div class="admin-option" onclick="location.href='removerObra.html'">
                <h2>Remover Obra Social</h2>
                <p>Eliminar una obra social existente</p>
            </div>
            <div class="admin-option" onclick="location.href='GestionTurnos.php'">
                <h2>Gestión de Turnos</h2>
                <p>Editar y cancelar turnos programados</p>
            </div>
        </div>
    </div>

    <script>
        document.querySelector('.user-icon').addEventListener('click', function() {
            this.parentElement.classList.toggle('active');
        });

        document.addEventListener('click', function(event) {
            const userMenu = document.querySelector('.user-menu');
            if (!userMenu.contains(event.target)) {
                userMenu.classList.remove('active');
            }
        });
    </script>
</body>
</html>
